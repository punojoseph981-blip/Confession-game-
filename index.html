<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Confession! 🤫</title>
    <style>
        body {
            background-color: #ffe6e6; /* Soft pink background */
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .game-box {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.1);
        }
        h1 {
            color: #ff4d6d;
        }
        .btn-container {
            margin-top: 30px;
            height: 50px;
            position: relative;
        }
        button {
            font-size: 18px;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            position: absolute;
            transition: 0.1s;
        }
        #yesBtn {
            background-color: #4cc9f0;
            color: white;
            left: 30px;
        }
        #noBtn {
            background-color: #ff4d6d;
            color: white;
            right: 30px;
        }
    </style>
</head>
<body>

    <div class="game-box">
        <h1 id="question">do u have a crush?</h1>
        <div class="btn-container">
            <button id="yesBtn" onclick="crushSaidYes()">Yes!</button>
            <button id="noBtn" ontouchstart="runAway()" onmouseover="runAway()">No</button>

        </div>
    </div>

    <script>
        function runAway() {
            const noBtn = document.getElementById('noBtn');
            
            // Generate random numbers to move the button
            const randomX = Math.floor(Math.random() * (window.innerWidth - 100));
            const randomY = Math.floor(Math.random() * (window.innerHeight - 50));
            
            noBtn.style.position = 'absolute';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        function crushSaidYes() {
            // Change the screen text when they click Yes
            document.getElementById('question').innerHTML = "wait for the right time";
            document.getElementById('yesBtn').style.display = 'none';
            document.getElementById('noBtn').style.display = 'none';
        }
    </script>

</body>
</html>
